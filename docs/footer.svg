<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Crafted by EPODONIOS">
<style>
.b1{animation:br 6s ease-in-out infinite alternate}
@keyframes br{from{opacity:.35}to{opacity:.85}}
.up{opacity:0;animation:fu .9s ease-out .2s forwards}
@keyframes fu{to{opacity:1}}
.sp{animation:sp 9s linear infinite;transform-origin:600px 34px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.up{opacity:1}}
</style>
<defs>
<radialGradient id="fg" cx=".5" cy=".5" r=".5">
  <stop offset="0" stop-color="#22d8ee" stop-opacity=".13"/><stop offset="1" stop-color="#22d8ee" stop-opacity="0"/>
</radialGradient>
<linearGradient id="ft" x1="0" x2="1">
  <stop offset="0" stop-color="#cfd9e2"/><stop offset=".5" stop-color="#22d8ee"/><stop offset="1" stop-color="#cfd9e2"/>
</linearGradient>
</defs>
<g class="b1"><ellipse cx="600" cy="60" rx="420" ry="60" fill="url(#fg)"/></g>
<ellipse cx="600" cy="34" rx="64" ry="14" fill="none" stroke="#22d8ee" stroke-opacity=".3" class="sp"/>
<circle cx="664" cy="34" r="2.6" fill="#22d8ee"/>
<circle cx="600" cy="34" r="13" fill="#0a1218" stroke="#22d8ee" stroke-opacity=".5"/>
<text x="600" y="39" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="800" fill="#22d8ee">S</text>
<g class="up" text-anchor="middle">
  <text x="600" y="78" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" fill="url(#ft)" letter-spacing="2">CRAFTED BY EPODONIOS</text>
  <text x="600" y="100" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10.5" letter-spacing="4" fill="#8fa3ad">SEPHIROTH — COMMAND THE ORBIT</text>
</g>
</svg>
