name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/edsel-rahimi/sephiroth

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (verify multi-stage Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sephiroth:ci
          build-args: |
            SEPH_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (panel answers /api/auth/session)
        run: |
          docker run -d --name sephiroth-ci -p 3000:3000 sephiroth:ci
          ok=""
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -m 3 http://127.0.0.1:3000/api/auth/session || true)"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 2
          done
          docker logs sephiroth-ci | tail -30 || true
          docker rm -f sephiroth-ci >/dev/null 2>&1 || true
          if [ -z "$ok" ]; then echo "::error::panel did not answer /api/auth/session"; exit 1; fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags: latest + semver)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SEPH_VERSION=${{ github.ref_name }}
          cache-from: type=gha
